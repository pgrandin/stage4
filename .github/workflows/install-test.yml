name: Install test
# Fresh-machine install of the published image in a UEFI VM: the Gentoo minimal
# ISO as a USB key, install.sh onto a blank NVMe disk, then boot that disk.
on:
  push:
    paths: [install.sh, tests/install-vm.exp, .github/workflows/install-test.yml]
  workflow_dispatch:
    inputs:
      target:
        description: Published image to install
        default: XPS-9730
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [master]

jobs:
  install:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, stage4]
    timeout-minutes: 180
    env:
      TARGET: ${{ inputs.target || 'XPS-9730' }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      WORK: /scratch/install-test/${{ github.run_id }}
    steps:
    - name: Require KVM
      run: '[ -c /dev/kvm ] || { echo "::error::no /dev/kvm on $RUNNER_NAME"; exit 1; }'

    - uses: actions/checkout@v4

    - name: Install QEMU
      run: |
        apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          qemu-system-x86 qemu-utils ovmf expect libarchive-tools curl

    - name: Fetch the live USB image
      run: |
        base=https://distfiles.gentoo.org/releases/amd64/autobuilds
        iso=$(curl -fsSL $base/latest-install-amd64-minimal.txt | awk '/\.iso/ {print $1}')
        mkdir -p "$WORK" && cd "$WORK"
        curl -fsSL -o live.iso "$base/$iso"
        bsdtar xf live.iso boot/gentoo boot/gentoo.igz boot/grub/grub.cfg
        # The USB key's default boot entry, minus the keymap prompt, plus a serial console.
        args=$(awk '$1 == "linux" {$1 = $2 = ""; print; exit}' boot/grub/grub.cfg | sed 's/dokeymap//')
        echo "LIVE_APPEND=$args console=ttyS0,115200" >> "$GITHUB_ENV"

    - name: Install from the USB key, then boot the installed disk
      run: |
        cp /usr/share/OVMF/OVMF_VARS_4M.fd "$WORK/vars.fd"
        qemu-img create -f qcow2 "$WORK/disk.qcow2" 64G
        OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd OVMF_VARS=$WORK/vars.fd DISK=$WORK/disk.qcow2 \
        ISO=$WORK/live.iso LIVE_KERNEL=$WORK/boot/gentoo LIVE_INITRD=$WORK/boot/gentoo.igz \
        SHOT=$WORK/screen.png expect tests/install-vm.exp

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: installed-screen
        path: ${{ env.WORK }}/screen.png
        if-no-files-found: ignore

    - name: Clean up
      if: always()
      run: rm -rf "$WORK"
