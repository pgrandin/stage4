name: Build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      fresh:
        description: Start a new filesystem instead of resuming the unfinished checkpoint
        type: boolean
        default: false

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check build scripts
        run: |
          python3 -m unittest discover -s tests
          for script in *.sh chroot/*.sh; do bash -n "$script"; done

  # First, determine which targets to run
  determine-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [[ "${{ github.ref_name }}" =~ ^target/ ]]; then
            # Extract target name from branch (target/<target>/<feature>)
            TARGET=$(echo "${{ github.ref_name }}" | cut -d'/' -f2)
            # Convert to uppercase for comparison
            TARGET_UPPER=$(echo "$TARGET" | tr '[:lower:]' '[:upper:]')
            # Create matrix with only the matching target
            echo "matrix={\"target\":[\"$(echo $TARGET_UPPER)\"]}" >> $GITHUB_OUTPUT
          else
            # If not a target-specific branch, build all active targets.
            # R710 and R630 are retired; XPS-9730 is the only live target.
            echo "matrix={\"target\":[\"XPS-9730\"]}" >> $GITHUB_OUTPUT
          fi

  # Main build job that uses the determined matrix
  build:
    needs: [determine-targets, check-scripts]
    if: github.ref == 'refs/heads/master'
    environment: sourceforge
    runs-on: [self-hosted, stage4]
    # 800 min (13h20m) was too short for a cold cache: @world (~5h) + a
    # from-source chromium (~14h on the 6-core dgaming i5) overran it and the
    # job was killed mid-chromium every time (reported as "cancelled"). Raised
    # to let chromium finish once and get cached; subsequent builds pull it as
    # a binpkg and run in a few hours.
    timeout-minutes: 1800
    strategy:
      matrix: ${{ fromJson(needs.determine-targets.outputs.matrix) }}
      fail-fast: false
    concurrency:
      group: stage4-${{ matrix.target }}
      cancel-in-progress: false
    env:
      # libvpx Makefiles consume lowercase target; keep CI metadata separate.
      STAGE4_TARGET: ${{ matrix.target }}
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Select persistent checkpoint
      env:
        FRESH: ${{ inputs.fresh || false }}
      run: |
        args=()
        if [ "$FRESH" = true ]; then args+=(--fresh); fi
        build_dir=$(python3 build_checkpoint.py "$STAGE4_TARGET" "$GITHUB_RUN_ID" --storage /scratch/builds/sourceforge "${args[@]}")
        printf 'build_dir=%s\nstage4_fs=%s/stage4\n' "$build_dir" "$build_dir" >> "$GITHUB_ENV"
        echo "Using persistent checkpoint: $build_dir"

    - name: Prepare Build Environment
      run: |
        apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xz-utils python3-pip python3-venv rsync wget curl tree openssh-client
        wget https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64 -O /usr/local/bin/yq
        chmod +x /usr/local/bin/yq

    - name: Prepare stage3
      run: |
        mkdir -p "$build_dir"
        if [ -f "$build_dir/stage3.ready" ]; then
          exit 0
        fi
        set -x

        BASEURL="http://distfiles.gentoo.org/releases/amd64/autobuilds/"
        # Fetch the latest stage3 file name from the latest-stage3-amd64-openrc-splitusr.txt
        LATEST_INFO_URL="${BASEURL}latest-stage3-amd64-openrc-splitusr.txt"
        STAGE3=$(wget -q -O - ${LATEST_INFO_URL} | grep -oP '\d+T\d+Z/stage3-amd64-openrc-splitusr-\d+T\d+Z\.tar\.xz' | head -n 1)

        if [ -z "${STAGE3}" ]; then
            echo "Failed to find the latest stage3 filename."
            exit 1
        fi

        # Download the stage3 tarball
        mkdir -p /dl
        wget -c -O "/dl/${STAGE3##*/}" "${BASEURL}${STAGE3}"

        # Verify if the file has been successfully downloaded
        if [ -f "/dl/${STAGE3##*/}" ]; then
          mkdir -p ${{ env.stage4_fs }}
          tar -xJpf "/dl/${STAGE3##*/}" -C ${{ env.stage4_fs }}
          sync -f "$build_dir"
          touch "$build_dir/stage3.ready"
        else
            echo "The download of the stage3 file failed."
            exit 1
        fi

    - name: Prepare configs
      run: |
        python3 -m venv ~/.venv
        ~/.venv/bin/pip install jinja2-cli pyyaml

        # Path to the config.yml file
        CONFIG_FILE="config.yml"

        # Path to the Jinja2 template
        TEMPLATE_FILE="make.conf.j2"

        # Extract keys (hostnames) from the YAML file
        # The following command gets the top-level keys in the YAML file
        KEYS=$(yq e '. | keys | .[]' "${CONFIG_FILE}")

        # Iterate over each key and process it
        for key in ${KEYS}; do
            if [[ "${key}" != "null" && ! -z "${key}" ]]; then
                # Generate temporary YAML file for the current key
                TEMP_YAML_FILE="temp_${key}.yml"
                yq e ".${key}" "${CONFIG_FILE}" > "${TEMP_YAML_FILE}"

                # Define the output file path
                OUTPUT_FILE="files/${key}/etc/portage/make.conf"

                # Ensure the output directory exists
                mkdir -p "$(dirname "${OUTPUT_FILE}")"

                # Run j2 using the temporary YAML file
                ~/.venv/bin/jinja2 --format=yaml "${TEMPLATE_FILE}" "${TEMP_YAML_FILE}" > "${OUTPUT_FILE}"

                echo "Generated configuration for ${key} in ${OUTPUT_FILE}"

                # Clean up the temporary file
                rm -f "${TEMP_YAML_FILE}"
            fi
        done

    - name: Prepare chroot
      run: |
        mountpoint -q "$stage4_fs/proc" || mount -t proc /proc "$stage4_fs/proc"
        if ! mountpoint -q "$stage4_fs/dev"; then
          mount --rbind /dev "$stage4_fs/dev"
          mount --make-rslave "$stage4_fs/dev"
        fi
        mountpoint -q "$stage4_fs/dev/pts" || mount -t devpts devpts "$stage4_fs/dev/pts"
        if [ "$(findmnt -n -o SOURCE -T "$stage4_fs/dev/shm" | tail -n 1)" != tmpfs ]; then
          mount -t tmpfs tmpfs "$stage4_fs/dev/shm"
        fi
        # /var/tmp and /var/cache are disk-backed (bind from /scratch) rather than
        # tmpfs: a RAM-capped tmpfs (~8G on a 16G builder) can't hold large package
        # build dirs (rust/llvm/gcc need >8G). Still separate mountpoints, so the
        # final archive excludes them after umount.
        mkdir -p "$build_dir/var-tmp" "$build_dir/var-cache"
        mountpoint -q "$stage4_fs/var/tmp" || mount --bind "$build_dir/var-tmp" "$stage4_fs/var/tmp"
        mountpoint -q "$stage4_fs/var/cache" || mount --bind "$build_dir/var-cache" "$stage4_fs/var/cache"

        rsync -vrtza files/common/ ${{ env.stage4_fs }}/
        rsync -vrtza files/${{ env.STAGE4_TARGET }}/ ${{ env.stage4_fs }}/
        mkdir -p "$stage4_fs/var/log/portage"

        tree ${{ env.stage4_fs }}/etc/portage/

        yq eval ".[\"${{ env.STAGE4_TARGET }}\"]" config.yml > ${{ env.stage4_fs }}/config.yml

        python3 public_edition.py configure "$stage4_fs"
        bash setup_packages.sh "$stage4_fs"

    - name: Mount shared binary package cache
      run: |
        cache=/dl/binpkgs/$STAGE4_TARGET
        mkdir -p "$cache" "$stage4_fs/var/cache/binpkgs"
        mountpoint -q "$stage4_fs/var/cache/binpkgs" || mount --bind "$cache" "$stage4_fs/var/cache/binpkgs"

    - name: chroot
      run: |
        if [ -f "$build_dir/bootstrap.done" ]; then exit 0; fi
        cp chroot/00.sh ${{ env.stage4_fs }}/00.sh
        chroot ${{ env.stage4_fs }} /bin/bash /00.sh ${{ env.STAGE4_TARGET }}
        chroot ${{ env.stage4_fs }} /usr/bin/eclean packages --unique-use
        sync -f "$build_dir"
        touch "$build_dir/bootstrap.done"

    - name: build kernel
      run: |
        if [ -f "$build_dir/kernel.done" ]; then exit 0; fi
        cp chroot/01_kernel.sh ${{ env.stage4_fs }}/01_kernel.sh
        chroot ${{ env.stage4_fs }} /bin/bash /01_kernel.sh ${{ env.STAGE4_TARGET }}
        sync -f "$build_dir"
        touch "$build_dir/kernel.done"

    - name: quirks
      run: |
        if [ -f "$build_dir/quirks.done" ]; then exit 0; fi
        cp chroot/02_quirks.sh ${{ env.stage4_fs }}/02_quirks.sh
        chroot ${{ env.stage4_fs }} /bin/bash /02_quirks.sh ${{ env.STAGE4_TARGET }}
        sync -f "$build_dir"
        touch "$build_dir/quirks.done"

    - name: rebuild world
      run: |
        if [ -f "$build_dir/world.done" ]; then
          echo "World build already completed"
          exit 0
        fi
        # Size MAKEOPTS to what this runner actually has. -j$(nproc) only
        # counts cores; on a memory-constrained runner that oversubscribes RAM
        # and OOM-kills heavy compiles. Bound jobs by the smaller of core count
        # and a ~2 GiB-per-job memory budget, measured against the container's
        # real cgroup limit (the chroot can't see /sys, so we compute it here
        # and bake it into make.conf for every emerge step downstream).
        CORES=$(nproc)
        LIMIT=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo max)
        case "$LIMIT" in
          ''|max) LIMIT=$(( $(awk '/MemTotal/{print $2}' /proc/meminfo) * 1024 )) ;;
        esac
        MEM_GIB=$(( LIMIT / 1024 / 1024 / 1024 ))
        MEM_JOBS=$(( MEM_GIB / 2 )); [ "$MEM_JOBS" -lt 1 ] && MEM_JOBS=1
        JOBS=$CORES; [ "$MEM_JOBS" -lt "$JOBS" ] && JOBS=$MEM_JOBS
        echo "Resource-aware MAKEOPTS: -j${JOBS} -l${CORES} (cores=${CORES}, mem-limit=${MEM_GIB}GiB)"
        sed -i "s/^MAKEOPTS=.*/MAKEOPTS=\"-j${JOBS} -l${CORES}\"/" ${{ env.stage4_fs }}/etc/portage/make.conf
        cp chroot/03_rebuild_world.sh ${{ env.stage4_fs }}/03_rebuild_world.sh
        resume=()
        # Selection already validated the saved merge list. Never fall back to
        # an empty-tree rebuild when an interrupted checkpoint is damaged.
        if [ -f "$build_dir/world.started" ]; then
          resume=(--resume)
        fi
        touch "$build_dir/world.started"
        chroot ${{ env.stage4_fs }} /bin/bash /03_rebuild_world.sh ${{ env.STAGE4_TARGET }} "${resume[@]}"
        sync -f "$build_dir"
        touch "$build_dir/world.done"

    - name: configure stage4
      run: |
        cp chroot/04_configure.sh ${{ env.stage4_fs }}/04_configure.sh
        chroot ${{ env.stage4_fs }} /bin/bash /04_configure.sh ${{ env.STAGE4_TARGET }}

    - name: install Firefox and Chromium
      run: |
        cp chroot/05_browsers.sh ${{ env.stage4_fs }}/05_browsers.sh
        bash ${{ env.stage4_fs }}/05_browsers.sh ${{ env.stage4_fs }}

    - name: validate stage4
      run: |
        cp chroot/06_validate.sh ${{ env.stage4_fs }}/06_validate.sh
        chroot ${{ env.stage4_fs }} /bin/bash /06_validate.sh

    - name: Audit public image and prepare publishing files
      run: |
        bash make-public.sh "$stage4_fs" --finalize
        release="$build_dir/var-tmp/sourceforge"
        mkdir -p "$release/binpkgs"
        curl -fsSL --retry 3 --max-time 60 \
          "https://downloads.sourceforge.net/project/stage4-gentoo/binpkgs/$STAGE4_TARGET/Packages?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
          -o "$release/previous-Packages"
        chroot "$stage4_fs" emaint binhost --fix
        chroot "$stage4_fs" python3 /usr/local/libexec/stage4-public-edition.py \
          binhost /var/cache/binpkgs /var/tmp/sourceforge/binpkgs \
          --previous-index /var/tmp/sourceforge/previous-Packages

    - name: Unmount chroot
      if: ${{ always() && env.stage4_fs != '' }}
      run: |
        sync
        for mount in dev/pts dev/shm proc dev var/tmp var/cache/binpkgs var/cache; do
          if mountpoint -q "$stage4_fs/$mount"; then
            umount -l "$stage4_fs/$mount"
          fi
        done

    - name: Publish to SourceForge
      env:
        SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
      run: |
        bash publish-sourceforge.sh "$STAGE4_TARGET" "$stage4_fs" \
          "$build_dir/var-tmp/sourceforge" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        touch "$build_dir/published.done"
